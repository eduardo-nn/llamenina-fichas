<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecionando...</title>
  <script>
    // Se a URL tiver ?id=, redirecionar para a página de fotos
    // Caso contrário, redirecionar para o formulário principal
    var search = window.location.search;
    if (search && search.indexOf('id=') !== -1) {
      window.location.href = "./resources/fotos.html" + search;
    } else {
      window.location.href = "./resources/index.html" + search;
    }
  </script>
  <meta http-equiv="refresh" content="2; URL='./resources/index.html'">
</head>
<body>
  <p>Redirecionando... Se não for redirecionado em alguns segundos, <a href="./resources/index.html">clique aqui</a>.</p>
</body>
</html>
